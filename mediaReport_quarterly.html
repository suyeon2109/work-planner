<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미디어채널 분기 리포트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f5f8; --surface:#ffffff; --surface-2:#fafafb; --border:#e6e6ec;
  --text:#1c1c22; --text-muted:#7a7a86; --text-light:#b0b0ba;
  --yt:#ff0000; --ig:#e6683c; --hp-visit:#2f80ed; --hp-pv:#00a884;
  --success:#0f7b6c; --danger:#eb5757; --warn:#f2994a;
  --radius:12px; --radius-sm:8px;
  --font:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --font-num:'SF Mono','Roboto Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(20,20,30,.04),0 4px 16px rgba(20,20,30,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;padding-bottom:80px;}
h1,h2,h3{font-weight:800;letter-spacing:-.01em;}
button,select,input{font-family:var(--font);}
button{cursor:pointer;}

.topbar{position:sticky; top:0; z-index:50; background:rgba(255,255,255,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
.topbar-inner{max-width:1200px; margin:0 auto; padding:10px 22px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
.brand-mark{width:30px;height:30px;flex-shrink:0;display:block;}
.brand-text h1{font-size:16px;}
.brand-text span{font-size:11.5px;color:var(--text-muted);}
.period-picker{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);}
.period-picker input, .period-picker select{border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:12.5px;color:var(--text);background:var(--surface-2);}
.period-picker input{width:78px;}
.period-label{font-size:11.5px;color:var(--text-light);margin-right:2px;white-space:nowrap;}
.period-print-label{display:none;}
.nav-btn{padding:6px 10px; font-size:12px; white-space:nowrap;}
.toolbar-actions{display:flex;gap:8px;}
.btn{border:1px solid var(--border); background:var(--surface); color:var(--text); padding:8px 14px; border-radius:8px; font-size:13px; font-weight:400; display:inline-flex; align-items:center; gap:6px; transition:.12s;}
.btn:hover{background:var(--surface-2); border-color:#d5d5de;}
.btn-primary{background:var(--text); color:#fff; border-color:var(--text);}
.btn-primary:hover{background:#000;}

.wrap{max-width:1200px;margin:0 auto;padding:18px 22px 40px;}
.section{margin-bottom:16px;}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.section-head h2{font-size:16px;}
.section-head .eyebrow{font-size:10px; font-weight:400; letter-spacing:.09em; text-transform:uppercase; color:var(--text-light);}
.section-desc{font-size:11.5px;color:var(--text-muted);margin-bottom:10px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}

.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
.summary-card{padding:12px 14px;}
.summary-card label{font-size:10.5px;color:var(--text-muted);display:flex;align-items:center;gap:5px;margin-bottom:4px;}
.summary-card .dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex-shrink:0;}
.summary-card b{font-family:var(--font-num);font-size:20px;font-weight:400;display:block;}
.summary-card .sub{font-size:10.5px;color:var(--text-light);margin-top:4px;}
.delta-badge{font-size:11.5px;font-weight:400;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;margin-top:6px;}
.delta-badge.up{color:var(--success);background:#e7f5f2;}
.delta-badge.down{color:var(--danger);background:#fdecec;}
.delta-badge.flat{color:var(--text-muted);background:var(--surface-2);}
.delta-badge.na{color:var(--text-light);background:var(--surface-2);}

.chart-box{padding:12px 14px;}
.chart-title{font-size:11.5px;font-weight:400;color:var(--text-muted);margin-bottom:8px;}
.chart-canvas-wrap{position:relative;width:100%;height:280px;}
.chart-canvas-wrap canvas{width:100% !important;height:100% !important;display:block;}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);margin-top:8px;}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;}

.insight-list{list-style:none;margin-top:0;}
.insight-list li{font-size:12px; padding:8px 12px; border-radius:7px; background:var(--surface-2); margin-bottom:6px; display:flex; gap:8px; align-items:center;}
.insight-list li .tag{flex-shrink:0; font-size:9px; line-height:1.3; font-weight:400; padding:2px 7px; border-radius:5px; color:#fff;}
.empty-note{font-size:12px;color:var(--text-light);padding:14px 2px;}

/* ===== 담당자 분석 의견 & 서식 툴바 (글자색 / 형광펜) ===== */
.opinion-card{padding:14px 16px;}
.opinion-box{
  min-height:100px; border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:12px 14px; font-size:12.5px; line-height:1.75; color:var(--text);
  background:var(--surface-2); white-space:pre-wrap; word-break:break-word; cursor:text;
}
.opinion-box:focus{outline:none; border-color:var(--hp-visit); background:#fff;}
.opinion-box:empty:before{content:attr(data-placeholder); color:var(--text-light);}
.format-toolbar{
  display:flex; align-items:center; flex-wrap:wrap; gap:10px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:8px 12px; margin-bottom:10px; font-size:11px; color:var(--text-muted);
}
.format-toolbar-group{display:flex; align-items:center; gap:5px;}
.format-toolbar-label{font-weight:600; letter-spacing:.02em; margin-right:2px;}
.swatch-btn{
  width:20px; height:20px; border-radius:50%; border:1px solid rgba(0,0,0,.12);
  cursor:pointer; padding:0; flex-shrink:0; transition:transform .1s;
}
.swatch-btn:hover{transform:scale(1.15);}
.swatch-btn.is-clear{background:#fff; position:relative;}
.swatch-btn.is-clear:before{
  content:''; position:absolute; left:2px; right:2px; top:50%; height:1px;
  background:var(--danger); transform:rotate(45deg);
}
.format-toolbar-divider{width:1px; height:18px; background:var(--border);}
.format-clear-btn{
  border:none; background:none; cursor:pointer; color:var(--text-muted);
  font-size:11px; padding:3px 8px; border-radius:4px; font-family:var(--font);
}
.format-clear-btn:hover{background:rgba(0,0,0,.06); color:var(--text);}

.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.2); z-index:999; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

@page{ size:A4 portrait; margin:19mm 9mm 18mm 9mm; }
@page{ @bottom-right{ content: counter(page) "/" counter(pages); font-size:21px; color:#6b6b7a; padding-bottom:3mm; } }
@media print{
  :root{ --text-muted:#26263a; --text-light:#3d3d52; }
  html, body{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .btn, .no-print, .toast{display:none !important;}
  body{background:#fff; padding:0; font-size:10px;}
  .wrap{max-width:100%; padding:0; margin-top:18mm !important;}
  .card{box-shadow:none; border:1px solid #ddd;}
  .section{margin-bottom:10px;}
  .card, .chart-box{break-inside:avoid; page-break-inside:avoid;}
  .topbar{display:block !important; position:fixed !important; top:0; left:0; right:0; background:#fff; backdrop-filter:none; border-bottom:1px solid #ddd; box-shadow:none;}
  .topbar-inner{padding:0 0 6px; gap:8px;}
  .brand-mark{width:20px; height:20px;}
  .brand-text h1{font-size:12px;}
  .brand-text span{font-size:8px;}
  .toolbar-actions{display:none !important;}
  .period-label, .period-picker input, .period-picker select, .nav-btn{display:none !important;}
  .period-print-label{display:inline-block !important; font-size:12px !important; font-weight:700; color:#000 !important; margin-left:auto;}
  .chart-canvas-wrap{height:190px;}
  .summary-card b{font-size:16px;}
  /* 방문자·페이지뷰가 한 줄, 유튜브·인스타그램이 한 줄이 되도록 2열로 줄바꿈 */
  .summary-grid{grid-template-columns:repeat(2, 1fr) !important;}
  .opinion-card{padding:8px 10px; break-inside:auto; page-break-inside:auto;}
  .opinion-box{min-height:40px; padding:8px 10px; font-size:9.5px; line-height:1.6; border-color:#ddd; background:#fff;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="brandMarkGrad" x1="0" y1="0" x2="30" y2="30" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ff0000"/><stop offset="34%" stop-color="#ff0000"/>
          <stop offset="34%" stop-color="#dc2743"/><stop offset="66%" stop-color="#bc1888"/>
          <stop offset="66%" stop-color="#2f80ed"/><stop offset="100%" stop-color="#2f80ed"/>
        </linearGradient></defs>
        <rect width="30" height="30" rx="8" fill="url(#brandMarkGrad)"/>
        <rect x="7" y="17.5" width="3.2" height="6.5" rx="1" fill="#fff" fill-opacity=".9"/>
        <rect x="13.4" y="12.5" width="3.2" height="11.5" rx="1" fill="#fff" fill-opacity=".95"/>
        <rect x="19.8" y="8" width="3.2" height="16" rx="1" fill="#fff"/>
        <path d="M6.5 14.5 L12.7 9.7 L18.7 12.3 L23.5 6.3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="23.5" cy="6.3" r="1.7" fill="#fff"/>
      </svg>
      <div class="brand-text">
        <h1>미디어채널 분기 리포트</h1>
        <span>홈페이지 · 유튜브 · 인스타그램 통합 분석 (주간 리포트 이력 자동 집계)</span>
      </div>
    </div>
    <div class="period-picker">
      <span class="period-label no-print">기준 분기</span>
      <button class="btn nav-btn" onclick="shiftPeriod(-1)" title="이전 분기">◀</button>

      <button class="btn nav-btn" onclick="shiftPeriod(1)" title="다음 분기">▶</button>
      <button class="btn nav-btn" onclick="goToday()" title="이번 분기">이번 분기</button>
      <span class="period-print-label" id="periodPrintLabel"></span>

    <div class="toolbar-actions no-print">
      <button class="btn" onclick="window.print()">🖨 인쇄</button>
      <button class="btn btn-primary" onclick="savePDF()">📄 PDF로 저장</button>
      <span id="cloudStatus" style="font-size:11px;color:#9b9a97;margin-left:6px;white-space:nowrap;">☁ 불러오는 중...</span>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- ============ 담당자 분석 의견 (최상단) ============ -->
  <div class="section section-opinion">
    <div class="section-head"><span class="eyebrow">MEMO</span><h2>담당자 분석 의견</h2></div>
    <div class="card opinion-card">
      <div class="format-toolbar no-print" id="opinionFormatToolbar">
        <div class="format-toolbar-group">
          <span class="format-toolbar-label">글자색</span>
          <button type="button" class="swatch-btn" style="background:#1c1c22" title="검정" onmousedown="event.preventDefault()" onclick="applyOpinionColor('#1c1c22')"></button>
          <button type="button" class="swatch-btn" style="background:#eb5757" title="빨강" onmousedown="event.preventDefault()" onclick="applyOpinionColor('#eb5757')"></button>
          <button type="button" class="swatch-btn" style="background:#2f80ed" title="파랑" onmousedown="event.preventDefault()" onclick="applyOpinionColor('#2f80ed')"></button>

        <div class="format-toolbar-group">

        <div class="format-toolbar-divider"></div>

      </div>
      <div class="opinion-box" id="opinionBox" contenteditable="true" data-placeholder="담당자 분석 의견을 입력하세요..." oninput="onOpinionInput()"></div>

  <div class="section summary-section">

    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <div class="section">
    <div class="section-head"><span class="eyebrow">01</span><h2>홈페이지 방문자 · 페이지뷰 추이</h2></div>
    <p class="section-desc">주간 리포트에 입력된 일자별 데이터를 월 단위로 합산해, 전분기 3개월과 이번 분기 3개월을 이어서 순서대로 보여줍니다.</p>
    <div class="card chart-box">
      <div class="chart-canvas-wrap"><canvas id="chart-traffic"></canvas></div>
      <div class="legend-row" id="trafficLegend"></div>

  <div class="section">
    <div class="section-head"><span class="eyebrow">02</span><h2>요약 코멘트</h2></div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
/* ===================================================================
   Firebase (주간 리포트와 동일 프로젝트/컬렉션 → hist_* 문서를 읽기 전용으로 집계)
=================================================================== */
const _firebaseConfig = {
  apiKey: "AIzaSyCKP3J0bM0eT0WIzX-migd5yllrc407kzc",
  authDomain: "work-planner-personal.firebaseapp.com",
  projectId: "work-planner-personal",
  storageBucket: "work-planner-personal.firebasestorage.app",
  messagingSenderId: "731464065419",
  appId: "1:731464065419:web:e43197adfb2611e1edcf8e"
};
let _db = null;
function getDb(){ if(_db) return _db; if(!firebase.apps.length) firebase.initializeApp(_firebaseConfig); _db = firebase.firestore(); return _db; }
const FS_COL = 'media_report_store';
async function storeList(prefix){
  try{
    const snap = await getDb().collection(FS_COL)
      .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
      .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '')
      .get();
    return snap.docs.map(d => ({ id: d.id, v: d.data().v }));
  }catch(e){ console.error(e); return []; }
}
async function storeGet(key){
  try{ const snap = await getDb().collection(FS_COL).doc(key).get(); return snap.exists ? snap.data().v : null; }
  catch(e){ console.error(e); return null; }
}
async function storeSet(key, value){
  try{ await getDb().collection(FS_COL).doc(key).set({ v: value }); return true; }
  catch(e){ console.error(e); return false; }
}
function setCloudStatus(text, isError){
  const el = document.getElementById('cloudStatus');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? '#c0392b' : '#9b9a97';
}

/* ===================================================================
   날짜 유틸
=================================================================== */
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function formatDateDot(dateStr){ if(!dateStr) return ''; const [y,m,d]=dateStr.split('-'); return `${y}. ${m}. ${d}.`; }
function formatDateLocalFromDate(d){ return ymd(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function todayStr(){ return formatDateLocalFromDate(new Date()); }
function monthsInQuarter(q){ return [(q-1)*3+1, (q-1)*3+2, (q-1)*3+3]; }

let curYear, curQuarter; // 1-4
function initPeriod(){
  const now = new Date();
  curYear = now.getFullYear();
  curQuarter = Math.ceil((now.getMonth()+1)/3);
}
function periodRange(y,q){
  const months = monthsInQuarter(q);
  return { start: ymd(y, months[0], 1), end: ymd(y, months[2], daysInMonth(y, months[2])) };
}
function prevPeriod(y,q){ return q === 1 ? {y:y-1, q:4} : {y, q:q-1}; }
function shiftPeriod(dir){
  if(dir < 0){ const p = prevPeriod(curYear, curQuarter); curYear = p.y; curQuarter = p.q; }
  else { curQuarter += 1; if(curQuarter > 4){ curQuarter = 1; curYear += 1; } }
  syncPeriodInputs(); renderAll();
}
function goToday(){ initPeriod(); syncPeriodInputs(); renderAll(); }
function syncPeriodInputs(){ document.getElementById('periodYear').value = curYear; document.getElementById('periodQuarter').value = String(curQuarter); }
function onPeriodInputChange(){
  curYear = Number(document.getElementById('periodYear').value) || curYear;
  curQuarter = Number(document.getElementById('periodQuarter').value) || curQuarter;
  renderAll();
}

/* ===================================================================
   데이터 로딩 & 집계
=================================================================== */
let historyList = [];
let homepageIndex = {};
let followerSeries = [];

function buildHomepageIndex(list){
  const map = {};
  list.forEach(v => {
    (v.homepage && v.homepage.rows || []).forEach(r => {
      if(r && r.date) map[r.date] = { visitors: Number(r.visitors)||0, pageviews: Number(r.pageviews)||0 };
    });
  });
  return map;
}
function buildFollowerSeries(list){
  return list.map(v => ({
      end: v.period && v.period.end,
      start: v.period && v.period.start,
      yt: (v.yt && v.yt.followers !== '' && v.yt.followers != null) ? Number(v.yt.followers) : null,
      ig: (v.ig && v.ig.followers !== '' && v.ig.followers != null) ? Number(v.ig.followers) : null,
    }))
    .filter(x => x.end)
    .sort((a,b) => a.end < b.end ? -1 : a.end > b.end ? 1 : 0);
}
function sumHomepage(map, start, end){
  let visitors = 0, pageviews = 0, days = 0;
  Object.keys(map).forEach(date => {
    if(date >= start && date <= end){ visitors += map[date].visitors; pageviews += map[date].pageviews; days++; }
  });
  return { visitors, pageviews, days };
}
function valueAtOrBefore(series, dateStr, key){
  let val = null;
  for(const s of series){ if(s.end <= dateStr){ if(s[key] != null) val = s[key]; } else break; }
  return val;
}
function prevEndDate(dateStr){ const d = new Date(dateStr); d.setDate(d.getDate()-1); return formatDateLocalFromDate(d); }

async function loadData(){
  setCloudStatus('☁ 불러오는 중...');
  const docs = await storeList('hist_');
  historyList = docs.map(d => d.v).filter(Boolean);
  homepageIndex = buildHomepageIndex(historyList);
  followerSeries = buildFollowerSeries(historyList);
  setCloudStatus(historyList.length ? ('☁ 연결됨 · 주간 리포트 ' + historyList.length + '건 반영') : '☁ 연결됨 (저장된 주간 리포트 없음)');
}

/* ===================================================================
   렌더링
=================================================================== */
let trafficChart = null;
function fmt(n){ return (n===null||n===undefined||isNaN(n)) ? '-' : Math.round(n).toLocaleString('en-US'); }
function deltaBadge(cur, prev, opts){
  opts = opts || {};
  if(prev === null || prev === undefined) return `<span class="delta-badge na">비교 데이터 없음</span>`;
  if(prev === 0) return cur > 0 ? `<span class="delta-badge up">▲ 신규 발생</span>` : `<span class="delta-badge flat">- 변화 없음</span>`;
  const diff = cur - prev;
  const pct = (diff/Math.abs(prev))*100;
  const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
  const arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '-';
  return `<span class="delta-badge ${cls}">${arrow} ${Math.abs(diff).toLocaleString('en-US')}${opts.unit||''} (${pct>=0?'+':''}${pct.toFixed(1)}%) ${opts.label||'전기간 대비'}</span>`;
}
function pctChange(cur, prev){ if(prev === null || prev === undefined || prev === 0) return null; return ((cur-prev)/Math.abs(prev))*100; }

function renderAll(){
  loadOpinionForPeriod();
  const {start, end} = periodRange(curYear, curQuarter);
  const prev = prevPeriod(curYear, curQuarter);
  const prevRange = periodRange(prev.y, prev.q);

  document.getElementById('summaryTitle').textContent = `${curYear}년 ${curQuarter}분기 종합 요약`;
  document.getElementById('periodPrintLabel').textContent = `${curYear}년 ${curQuarter}분기 · 작성일 ${formatDateDot(todayStr())}`;

  const cur = sumHomepage(homepageIndex, start, end);
  const prv = sumHomepage(homepageIndex, prevRange.start, prevRange.end);

  const ytStart = valueAtOrBefore(followerSeries, prevEndDate(start), 'yt');
  const ytEnd = valueAtOrBefore(followerSeries, end, 'yt');
  const igStart = valueAtOrBefore(followerSeries, prevEndDate(start), 'ig');
  const igEnd = valueAtOrBefore(followerSeries, end, 'ig');

  renderSummary({cur, prv, ytStart, ytEnd, igStart, igEnd, periodLabel: '전분기 대비'});
  renderTrafficChart();
  renderInsights({cur, prv, ytStart, ytEnd, igStart, igEnd});
}

function renderSummary({cur, prv, ytStart, ytEnd, igStart, igEnd, periodLabel}){
  const grid = document.getElementById('summaryGrid');
  const ytGrowth = (ytEnd!=null && ytStart!=null) ? ytEnd-ytStart : null;
  const igGrowth = (igEnd!=null && igStart!=null) ? igEnd-igStart : null;
  grid.innerHTML = `
    <div class="card summary-card">
      <label><span class="dot" style="background:#2f80ed"></span>홈페이지 방문자수 (합계)</label>
      <b>${fmt(cur.visitors)}</b>
      ${deltaBadge(cur.visitors, prv.days ? prv.visitors : null, {label:periodLabel})}
    </div>
    <div class="card summary-card">
      <label><span class="dot" style="background:#00a884"></span>페이지뷰 (합계)</label>
      <b>${fmt(cur.pageviews)}</b>
      ${deltaBadge(cur.pageviews, prv.days ? prv.pageviews : null, {label:periodLabel})}
    </div>
    <div class="card summary-card">
      <label><span class="dot" style="background:#ff0000"></span>유튜브 구독자수 (기간 말 기준)</label>
      <b>${ytEnd!=null ? ytEnd.toLocaleString('en-US') : '-'}</b>
      ${ytGrowth!=null ? deltaBadge(ytEnd, ytStart, {label:periodLabel}) : `<span class="delta-badge na">비교 데이터 없음</span>`}
    </div>
    <div class="card summary-card">
      <label><span class="dot" style="background:#e6683c"></span>인스타그램 팔로워수 (기간 말 기준)</label>
      <b>${igEnd!=null ? igEnd.toLocaleString('en-US') : '-'}</b>
      ${igGrowth!=null ? deltaBadge(igEnd, igStart, {label:periodLabel}) : `<span class="delta-badge na">비교 데이터 없음</span>`}
    </div>
  `;
}

function monthBucketsForQuarterOf(y, q){
  const months = monthsInQuarter(q);
  return months.map(m => {
    const start = ymd(y, m, 1), end = ymd(y, m, daysInMonth(y, m));
    const agg = sumHomepage(homepageIndex, start, end);
    return { label: `${y}.${pad2(m)}`, start, end, visitors: agg.visitors, pageviews: agg.pageviews };
  });
}
function monthBucketsForQuarter(){ return monthBucketsForQuarterOf(curYear, curQuarter); }

/* 막대 위에 값(방문자/페이지뷰)을 작게 표시하는 Chart.js 플러그인 */
const barValueLabelPlugin = {
  id: 'barValueLabelPlugin',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    chart.data.datasets.forEach((dataset, dsIndex) => {
      const meta = chart.getDatasetMeta(dsIndex);
      if(meta.hidden) return;
      meta.data.forEach((bar, index) => {
        const value = dataset.data[index];
        if(value === null || value === undefined || value === 0) return;
        const text = Number(value).toLocaleString();
        ctx.save();
        ctx.font = '10px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = dataset.backgroundColor || '#333';
        ctx.fillText(text, bar.x, bar.y - 4);
        ctx.restore();
      });
    });
  }
};
Chart.register(barValueLabelPlugin);

/* 이번 분기만 보면 흐름을 알기 어려우므로, 전분기 3개월과 이번 분기 3개월을 이어서
   (예: 4,5,6,7,8,9월) 한 화면에서 순서대로 볼 수 있게 한다. */
function renderTrafficChart(){
  const ctx = document.getElementById('chart-traffic');
  const prev = prevPeriod(curYear, curQuarter);
  const prevBuckets = monthBucketsForQuarterOf(prev.y, prev.q);
  const curBuckets = monthBucketsForQuarterOf(curYear, curQuarter);
  const buckets = [...prevBuckets, ...curBuckets];
  const data = {
    labels: buckets.map(b=>b.label),
    datasets: [
      {label:'방문자', data:buckets.map(b=>b.visitors), backgroundColor:'#2f80ed', borderRadius:4, maxBarThickness:34},
      {label:'페이지뷰', data:buckets.map(b=>b.pageviews), backgroundColor:'#00a884', borderRadius:4, maxBarThickness:34},
    ]
  };
  const options = {
    responsive:true, maintainAspectRatio:false,
    layout:{padding:{top:18}},
    plugins:{legend:{display:false}},
    scales:{ y:{beginAtZero:true, ticks:{precision:0, callback:v=>Number(v).toLocaleString()}, grid:{color:'#f2f2f5'}}, x:{grid:{display:false}} }
  };
  if(trafficChart){ trafficChart.data=data; trafficChart.options=options; trafficChart.update('none'); }
  else trafficChart = new Chart(ctx, {type:'bar', data, options});

  const legend = document.getElementById('trafficLegend');
  if(legend){
    legend.innerHTML = `
      <span><span class="legend-dot" style="background:#2f80ed"></span>방문자</span>
      <span><span class="legend-dot" style="background:#00a884"></span>페이지뷰</span>
    `;
  }
}

function renderInsights({cur, prv, ytStart, ytEnd, igStart, igEnd}){
  const list = document.getElementById('insights');
  const items = [];
  const vPct = pctChange(cur.visitors, prv.days ? prv.visitors : null);
  if(vPct !== null) items.push(`<li><span class="tag" style="background:#2f80ed">방문자</span>이번 분기 방문자수가 전분기 대비 ${vPct>=0?'':'−'}${Math.abs(vPct).toFixed(1)}% ${vPct>=0?'증가':'감소'}했습니다 (${cur.visitors.toLocaleString('en-US')}명).</li>`);
  const pPct = pctChange(cur.pageviews, prv.days ? prv.pageviews : null);
  if(pPct !== null) items.push(`<li><span class="tag" style="background:#00a884">페이지뷰</span>페이지뷰가 전분기 대비 ${pPct>=0?'':'−'}${Math.abs(pPct).toFixed(1)}% ${pPct>=0?'증가':'감소'}했습니다 (${cur.pageviews.toLocaleString('en-US')}회).</li>`);
  if(ytEnd!=null && ytStart!=null){ const g = ytEnd-ytStart; items.push(`<li><span class="tag" style="background:#ff0000">YouTube</span>유튜브 구독자가 이번 분기 ${g>=0?'+':''}${g.toLocaleString('en-US')}명 ${g>=0?'증가':'감소'}하여 ${ytEnd.toLocaleString('en-US')}명이 되었습니다.</li>`); }
  if(igEnd!=null && igStart!=null){ const g = igEnd-igStart; items.push(`<li><span class="tag" style="background:#e6683c">Instagram</span>인스타그램 팔로워가 이번 분기 ${g>=0?'+':''}${g.toLocaleString('en-US')}명 ${g>=0?'증가':'감소'}하여 ${igEnd.toLocaleString('en-US')}명이 되었습니다.</li>`); }
  list.innerHTML = items.length ? items.join('') : `<div class="empty-note">비교할 수 있는 데이터가 아직 충분하지 않습니다. 주간 리포트를 몇 주 더 저장하면 자동으로 채워집니다.</div>`;
}

function savePDF(){
  const title = document.title;
  document.title = `미디어채널_분기리포트_${curYear}-Q${curQuarter}`;
  const restore = () => { document.title = title; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  showToast('인쇄 대화상자에서 "PDF로 저장"을 선택해주세요');
  window.print();
}
let toastTimer = null;
function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#c0392b' : '#1c1c22';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ===================================================================
   담당자 분석 의견 — 글자색 / 형광펜 서식 (주간 리포트와 동일한 방식).
   기간(연도/분기/월)별로 따로 저장되며, 기간을 이동하면 그 기간에 저장된
   의견을 새로 불러온다.
=================================================================== */
function opinionKeyForCurrentPeriod(){ return 'opinion_quarterly_' + curYear + '-Q' + curQuarter; }
function escAttr(s){
  return (s===null||s===undefined? '' : String(s))
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function opinionToDisplayHtml(raw){
  if(!raw) return '';
  if(/<[a-z][\s\S]*>/i.test(raw)) return raw; // 이미 색상/형광펜 서식(HTML)으로 저장된 값
  return escAttr(raw).replace(/\n/g, '<br>'); // 예전 버전: 일반 텍스트로 저장됨
}
let _opinionLoadToken = 0;
async function loadOpinionForPeriod(){
  const key = opinionKeyForCurrentPeriod();
  const myToken = ++_opinionLoadToken;
  const raw = await storeGet(key);
  if(myToken !== _opinionLoadToken) return; // 그 사이 다른 기간으로 이동했으면 이 결과는 버린다
  const box = document.getElementById('opinionBox');
  if(box) box.innerHTML = opinionToDisplayHtml(raw || '');
}
let _opinionSaveTimer = null;
function onOpinionInput(){
  clearTimeout(_opinionSaveTimer);
  const key = opinionKeyForCurrentPeriod();
  const html = document.getElementById('opinionBox').innerHTML;
  _opinionSaveTimer = setTimeout(() => { storeSet(key, html); }, 800);
}
function opinionEnsureFocus(){
  const el = document.getElementById('opinionBox');
  if(!el) return null;
  const sel = window.getSelection();
  const inside = sel && sel.rangeCount > 0 && el.contains(sel.getRangeAt(0).commonAncestorContainer);
  if(!inside){
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  return el;
}
function opinionGetSelRange(){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0) return null;
  return {sel, range: sel.getRangeAt(0)};
}
function opinionEscapeStyledBoundary(root, range){
  let container = range.startContainer;
  let offset = range.startOffset;
  while(container && container !== root){
    const len = container.nodeType === 3 ? container.length : container.childNodes.length;
    const parent = container.parentNode;
    if(!parent) break;
    if(offset === len){
      const idx = Array.prototype.indexOf.call(parent.childNodes, container);
      container = parent; offset = idx + 1;
    } else if(offset === 0){
      const idx = Array.prototype.indexOf.call(parent.childNodes, container);
      container = parent; offset = idx;
    } else {
      break;
    }
  }
  const r = document.createRange();
  r.setStart(container, offset);
  r.collapse(true);
  return r;
}
function opinionInsertTypingMarker(el, range, styleProps){
  const escapedRange = opinionEscapeStyledBoundary(el, range);
  const span = document.createElement('span');
  Object.assign(span.style, styleProps);
  span.appendChild(document.createTextNode('\u200B'));
  escapedRange.insertNode(span);
  const sel = window.getSelection();
  const newRange = document.createRange();
  newRange.setStart(span.firstChild, 1);
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);
}
function applyOpinionColor(color){
  const el = opinionEnsureFocus();
  if(!el) return;
  const info = opinionGetSelRange();
  try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
  if(info && info.range.collapsed){
    opinionInsertTypingMarker(el, info.range, {color});
  } else {
    document.execCommand('foreColor', false, color);
  }
  onOpinionInput();
}
function applyOpinionHighlight(color){
  const el = opinionEnsureFocus();
  if(!el) return;
  const info = opinionGetSelRange();
  try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
  if(info && info.range.collapsed){
    opinionInsertTypingMarker(el, info.range, {backgroundColor:color});
  } else {
    const cmd = document.queryCommandSupported && document.queryCommandSupported('hiliteColor') ? 'hiliteColor' : 'backColor';
    document.execCommand(cmd, false, color);
  }
  onOpinionInput();
}
function clearOpinionFormat(){
  const el = opinionEnsureFocus();
  if(!el) return;
  const info = opinionGetSelRange();
  try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
  document.execCommand('removeFormat');
  const sel2 = window.getSelection();
  if(info && info.range.collapsed && sel2 && sel2.rangeCount){
    opinionInsertTypingMarker(el, sel2.getRangeAt(0), {color:'#1c1c22', backgroundColor:'transparent'});
  } else {
    document.execCommand('foreColor', false, '#1c1c22');
    const hiliteCmd = document.queryCommandSupported && document.queryCommandSupported('hiliteColor') ? 'hiliteColor' : 'backColor';
    document.execCommand(hiliteCmd, false, 'transparent');
  }
  onOpinionInput();
}

/* ===================================================================
   초기화
=================================================================== */
initPeriod();
syncPeriodInputs();
(async function init(){
  await loadData();
  renderAll();
})();
